name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BASE_URL: http://localhost:3000
      AUTH0_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: tenant.example.invalid
      AUTH0_CLIENT_ID: ci-placeholder
      AUTH0_CLIENT_SECRET: ci-placeholder
      AUTH0_SECRET: ci-placeholder-ci-placeholder-ci-placeholder-ci-placeholder
      MONGODB_URL: mongodb://127.0.0.1:27017/lawai_ci
      DEEPSEEK_API_KEY: ci-placeholder
      PINECONE_API_KEY: ci-placeholder
      HOST_ADD: host.example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Mocked authorization and RAG integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Secret scan
        run: npm run scan:secrets:working-tree
